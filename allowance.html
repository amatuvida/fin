<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>나의 용돈기입장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --cream:#FFF8EF;
    --mint:#BFEBD9;
    --peach:#FFD9AE;
    --coral:#FF8C78;
    --navy:#3A3654;
    --yellow:#FFE79A;
    --card:#FFFFFF;
    --need:#7FD1AE;
    --want:#FFA6A0;
    --shadow: 0 6px 0 rgba(58,54,84,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    font-family:'Gowun Dodum', sans-serif;
    color:var(--navy);
    min-height:100vh;
    padding-bottom:88px;
    -webkit-tap-highlight-color:transparent;
  }
  .title-font{font-family:'Gaegu', sans-serif;}

  /* ===== Header ===== */
  header{
    padding:22px 18px 26px;
    background:linear-gradient(180deg, var(--mint) 0%, var(--cream) 100%);
    border-radius:0 0 32px 32px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  header h1{
    font-family:'Gaegu', sans-serif;
    font-size:28px;
    margin:0 0 14px;
    font-weight:700;
  }
  .mascot-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
  }
  .mascot{
    font-size:52px;
    animation:bob 2.4s ease-in-out infinite;
    filter:drop-shadow(0 4px 0 rgba(0,0,0,0.08));
  }
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(-3deg);}
    50%{transform:translateY(-8px) rotate(3deg);}
  }
  .balance-bubble{
    background:var(--card);
    border-radius:20px;
    padding:12px 20px;
    box-shadow:var(--shadow);
    position:relative;
  }
  .balance-bubble:after{
    content:"";
    position:absolute;
    left:-10px; top:50%;
    transform:translateY(-50%);
    border:10px solid transparent;
    border-right-color:var(--card);
  }
  .balance-label{font-size:13px;opacity:0.7;}
  .balance-amount{
    font-family:'Gaegu', sans-serif;
    font-size:26px;
    font-weight:700;
    color:var(--coral);
  }

  /* ===== Tabs content ===== */
  main{padding:16px;max-width:480px;margin:0 auto;}
  .card{
    background:var(--card);
    border-radius:24px;
    padding:20px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
  }
  .section-title{
    font-family:'Gaegu', sans-serif;
    font-size:20px;
    font-weight:700;
    margin:0 0 12px;
    display:flex;align-items:center;gap:6px;
  }

  /* Toggle income/expense */
  .type-toggle{
    display:flex;
    background:var(--cream);
    border-radius:18px;
    padding:5px;
    gap:5px;
    margin-bottom:16px;
  }
  .type-toggle button{
    flex:1;
    border:none;
    background:transparent;
    padding:12px 0;
    border-radius:14px;
    font-family:'Gaegu', sans-serif;
    font-size:18px;
    font-weight:700;
    color:var(--navy);
    cursor:pointer;
    transition:all .15s;
  }
  .type-toggle button.active.income{background:var(--mint); color:#1d5c46;}
  .type-toggle button.active.expense{background:var(--peach); color:#8a4a1d;}

  label.field-label{
    font-size:14px;
    opacity:0.75;
    margin:14px 0 6px;
    display:block;
  }
  input[type=number], input[type=text], input[type=date]{
    width:100%;
    padding:14px 16px;
    border-radius:16px;
    border:2px solid #EDE7DC;
    font-size:18px;
    font-family:'Gowun Dodum', sans-serif;
    background:#FFFDF9;
    color:var(--navy);
  }
  input:focus{outline:2px solid var(--mint); border-color:var(--mint);}

  .quick-amounts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .quick-amounts button{
    border:none;
    background:var(--yellow);
    padding:8px 14px;
    border-radius:14px;
    font-size:14px;
    font-family:'Gowun Dodum', sans-serif;
    cursor:pointer;
    color:var(--navy);
  }

  .category-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
    margin-top:6px;
  }
  .category-grid button{
    border:2px solid #EDE7DC;
    background:#FFFDF9;
    border-radius:16px;
    padding:10px 4px;
    font-size:24px;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    cursor:pointer;
  }
  .category-grid button span.cat-name{font-size:11px;font-family:'Gowun Dodum';}
  .category-grid button.selected{background:var(--mint);border-color:var(--mint);}
  .type-expense .category-grid button.selected{background:var(--peach);border-color:var(--peach);}

  .needwant-wrap{margin-top:16px;}
  .needwant-grid{display:flex;gap:10px;margin-top:8px;}
  .nw-btn{
    flex:1;
    border:3px solid #EDE7DC;
    background:#FFFDF9;
    border-radius:18px;
    padding:16px 8px;
    text-align:center;
    cursor:pointer;
  }
  .nw-btn .emoji{font-size:30px;display:block;margin-bottom:4px;}
  .nw-btn .txt{font-family:'Gaegu', sans-serif;font-size:16px;font-weight:700;}
  .nw-btn.need.selected{background:var(--need);border-color:var(--need);color:#0b3d29;}
  .nw-btn.want.selected{background:var(--want);border-color:var(--want);color:#5c1810;}
  .nw-hint{font-size:12px;opacity:0.65;margin-top:8px;text-align:center;}

  .save-btn{
    width:100%;
    margin-top:20px;
    border:none;
    background:var(--coral);
    color:white;
    font-family:'Gaegu', sans-serif;
    font-size:20px;
    font-weight:700;
    padding:16px;
    border-radius:18px;
    cursor:pointer;
    box-shadow:0 5px 0 #d9614c;
  }
  .save-btn:active{transform:translateY(3px); box-shadow:0 2px 0 #d9614c;}

  /* Stats */
  .month-picker{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;
  }
  .month-picker button{
    border:none;background:var(--cream);
    width:36px;height:36px;border-radius:50%;
    font-size:18px;cursor:pointer;
  }
  .month-picker .m-label{font-family:'Gaegu';font-size:20px;font-weight:700;}

  .summary-grid{display:flex;gap:10px;margin-bottom:18px;}
  .summary-item{
    flex:1;
    background:var(--cream);
    border-radius:16px;
    padding:12px 8px;
    text-align:center;
  }
  .summary-item .s-label{font-size:12px;opacity:0.7;}
  .summary-item .s-val{font-family:'Gaegu';font-size:18px;font-weight:700;margin-top:2px;}
  .summary-item.income .s-val{color:#1d8a5e;}
  .summary-item.expense .s-val{color:var(--coral);}
  .summary-item.balance .s-val{color:var(--navy);}

  canvas{max-width:100%;}

  .empty-msg{
    text-align:center;
    padding:30px 10px;
    opacity:0.6;
    font-size:14px;
  }

  /* History */
  .history-item{
    display:flex;align-items:center;gap:12px;
    padding:12px 6px;
    border-bottom:1px solid #F0EAE0;
  }
  .history-item:last-child{border-bottom:none;}
  .h-icon{
    width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0;
  }
  .h-icon.income{background:var(--mint);}
  .h-icon.expense{background:var(--peach);}
  .h-info{flex:1;min-width:0;}
  .h-cat{font-size:14px;font-weight:700;}
  .h-date{font-size:11px;opacity:0.6;}
  .h-nw{font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px;}
  .h-nw.need{background:var(--need);color:#0b3d29;}
  .h-nw.want{background:var(--want);color:#5c1810;}
  .h-amt{font-family:'Gaegu';font-size:16px;font-weight:700;white-space:nowrap;}
  .h-amt.income{color:#1d8a5e;}
  .h-amt.expense{color:var(--coral);}
  .h-del{
    border:none;background:none;font-size:16px;opacity:0.4;cursor:pointer;padding:4px 6px;
  }
  .h-del.confirm{opacity:1;color:var(--coral);font-weight:700;}

  .day-group-label{
    font-size:12px;font-weight:700;opacity:0.55;
    margin:14px 0 4px;
  }

  /* Bottom nav */
  nav{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--card);
    display:flex;
    box-shadow:0 -4px 14px rgba(0,0,0,0.06);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  nav button{
    flex:1;
    border:none;background:none;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 0;
    font-family:'Gowun Dodum';
    font-size:12px;
    color:#B7AFA0;
    cursor:pointer;
  }
  nav button .n-icon{font-size:22px;}
  nav button.active{color:var(--coral);}

  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .toast{
    position:fixed;
    bottom:96px;left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--navy);
    color:white;
    padding:12px 22px;
    border-radius:16px;
    font-size:14px;
    opacity:0;
    transition:all .25s;
    pointer-events:none;
    z-index:20;
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){
    .mascot{animation:none;}
  }
</style>
</head>
<body>

<header>
  <h1>🐷 나의 용돈기입장</h1>
  <div class="mascot-wrap">
    <div class="mascot" id="mascotFace">🐷</div>
    <div class="balance-bubble">
      <div class="balance-label">지금 내 돈은</div>
      <div class="balance-amount" id="balanceDisplay">0원</div>
    </div>
  </div>
</header>

<main>

  <!-- 입력 -->
  <section class="tab-panel active" id="panel-input">
    <div class="card" id="inputTypeCard">
      <div class="type-toggle">
        <button type="button" class="income active" data-type="income">💰 수입</button>
        <button type="button" class="expense" data-type="expense">🛍️ 지출</button>
      </div>

      <label class="field-label">얼마예요?</label>
      <input type="text" id="amountInput" placeholder="0" inputmode="numeric" autocomplete="off">
      <div class="quick-amounts">
        <button type="button" data-amt="1000">+1,000</button>
        <button type="button" data-amt="5000">+5,000</button>
        <button type="button" data-amt="10000">+10,000</button>
        <button type="button" data-amt="0" id="clearAmt">지우기</button>
      </div>

      <label class="field-label">어떤 종류예요?</label>
      <div class="category-grid" id="categoryGrid"></div>

      <div class="needwant-wrap" id="needWantWrap" style="display:none;">
        <label class="field-label">이건 꼭 필요했나요?</label>
        <div class="needwant-grid">
          <div class="nw-btn need" data-nw="need">
            <span class="emoji">🌱</span><span class="txt">필요해요</span>
          </div>
          <div class="nw-btn want" data-nw="want">
            <span class="emoji">🎈</span><span class="txt">갖고싶어요</span>
          </div>
        </div>
        <div class="nw-hint">필요(Need)는 꼭 있어야 하는 것, 원함(Want)은 있으면 좋은 것이에요</div>
      </div>

      <label class="field-label">언제예요?</label>
      <input type="date" id="dateInput">

      <label class="field-label">메모 (선택)</label>
      <input type="text" id="memoInput" placeholder="예: 편의점 젤리">

      <button class="save-btn" id="saveBtn">저장하기 ✏️</button>
    </div>
  </section>

  <!-- 통계 -->
  <section class="tab-panel" id="panel-stats">
    <div class="card">
      <div class="month-picker">
        <button id="prevMonth">‹</button>
        <div class="m-label" id="monthLabel">2026년 7월</div>
        <button id="nextMonth">›</button>
      </div>
      <div class="summary-grid">
        <div class="summary-item income"><div class="s-label">수입</div><div class="s-val" id="sumIncome">0</div></div>
        <div class="summary-item expense"><div class="s-label">지출</div><div class="s-val" id="sumExpense">0</div></div>
        <div class="summary-item balance"><div class="s-label">남은 돈</div><div class="s-val" id="sumBalance">0</div></div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">📊 수입 vs 지출</div>
      <canvas id="barChart" height="180"></canvas>
    </div>

    <div class="card">
      <div class="section-title">🌱🎈 필요 vs 갖고싶어요</div>
      <div id="donutWrap">
        <canvas id="donutChart" height="180"></canvas>
      </div>
      <div class="empty-msg" id="donutEmpty" style="display:none;">이번 달에는 지출 기록이 없어요</div>
    </div>
  </section>

  <!-- 기록 -->
  <section class="tab-panel" id="panel-history">
    <div class="card">
      <div class="section-title">📒 전체 기록</div>
      <div id="historyList"></div>
      <div class="empty-msg" id="historyEmpty" style="display:none;">아직 기록이 없어요. 첫 기록을 남겨보세요!</div>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<nav>
  <button class="active" data-panel="input"><span class="n-icon">✏️</span>입력</button>
  <button data-panel="stats"><span class="n-icon">📊</span>통계</button>
  <button data-panel="history"><span class="n-icon">📒</span>기록</button>
</nav>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "allowance_records_v1";

  const CATEGORIES = {
    income: [
      {id:"allowance", name:"용돈", emoji:"💵"},
      {id:"gift", name:"세뱃돈", emoji:"🧧"},
      {id:"chore", name:"심부름", emoji:"🧹"},
      {id:"other_in", name:"기타", emoji:"✨"}
    ],
    expense: [
      {id:"snack", name:"간식", emoji:"🍬"},
      {id:"toy", name:"장난감", emoji:"🧸"},
      {id:"book", name:"책/학용품", emoji:"📚"},
      {id:"gamecard", name:"게임/카드", emoji:"🎮"},
      {id:"gift_out", name:"선물", emoji:"🎁"},
      {id:"transport", name:"교통", emoji:"🚌"},
      {id:"saving", name:"저금", emoji:"🐷"},
      {id:"other_out", name:"기타", emoji:"✨"}
    ]
  };

  let state = {
    type: "income",
    category: null,
    needWant: null,
    records: [],
    viewMonth: null // {year, month} 0-indexed month
  };

  let barChart = null, donutChart = null;

  // ---------- storage ----------
  function loadRecords(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      return [];
    }
  }
  function saveRecords(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.records));
    }catch(e){ /* ignore quota errors */ }
  }

  // ---------- utils ----------
  function fmt(n){
    return Number(n||0).toLocaleString('ko-KR') + "원";
  }
  function digitsOnly(s){
    return (s || "").replace(/[^0-9]/g, "");
  }
  function formatAmountField(){
    const field = document.getElementById('amountInput');
    const raw = digitsOnly(field.value);
    field.value = raw ? Number(raw).toLocaleString('ko-KR') : "";
  }
  function todayStr(){
    const d = new Date();
    return d.toISOString().slice(0,10);
  }
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(()=> t.classList.remove('show'), 1800);
  }

  // ---------- rendering: category grid ----------
  function renderCategoryGrid(){
    const grid = document.getElementById('categoryGrid');
    grid.innerHTML = "";
    const list = CATEGORIES[state.type];
    if(state.category === null || !list.find(c=>c.id===state.category)){
      state.category = null;
    }
    list.forEach(cat=>{
      const btn = document.createElement('button');
      btn.type = "button";
      btn.innerHTML = `${cat.emoji}<span class="cat-name">${cat.name}</span>`;
      if(state.category === cat.id) btn.classList.add('selected');
      btn.addEventListener('click', ()=>{
        state.category = cat.id;
        renderCategoryGrid();
      });
      grid.appendChild(btn);
    });
  }

  function setType(type){
    state.type = type;
    state.category = null;
    document.querySelectorAll('.type-toggle button').forEach(b=>{
      b.classList.toggle('active', b.dataset.type === type);
    });
    document.getElementById('needWantWrap').style.display = (type === 'expense') ? 'block' : 'none';
    if(type === 'income'){ state.needWant = null; }
    renderCategoryGrid();
    renderNeedWant();
  }

  function renderNeedWant(){
    document.querySelectorAll('.nw-btn').forEach(b=>{
      b.classList.toggle('selected', b.dataset.nw === state.needWant);
    });
  }

  // ---------- save entry ----------
  function handleSave(){
    const amountRaw = digitsOnly(document.getElementById('amountInput').value);
    const amount = parseInt(amountRaw, 10);
    if(!amount || amount <= 0){
      showToast("💡 얼마인지 입력해 주세요!");
      return;
    }
    if(!state.category){
      showToast("💡 종류를 골라 주세요!");
      return;
    }
    if(state.type === 'expense' && !state.needWant){
      showToast("💡 필요/갖고싶어요를 골라 주세요!");
      return;
    }
    const date = document.getElementById('dateInput').value || todayStr();
    const memo = document.getElementById('memoInput').value.trim();

    const record = {
      id: Date.now() + "_" + Math.random().toString(36).slice(2,7),
      type: state.type,
      amount: amount,
      category: state.category,
      needWant: state.type === 'expense' ? state.needWant : null,
      date: date,
      memo: memo
    };
    state.records.push(record);
    saveRecords();

    // reset form (keep type)
    document.getElementById('amountInput').value = "";
    document.getElementById('memoInput').value = "";
    state.category = null;
    state.needWant = null;
    renderCategoryGrid();
    renderNeedWant();

    showToast(state.type === 'income' ? "저장했어요! 💰" : "저장했어요! 🛍️");
    renderBalance();
    updateMascot();
  }

  // ---------- balance ----------
  function renderBalance(){
    let total = 0;
    state.records.forEach(r=>{
      total += (r.type === 'income' ? r.amount : -r.amount);
    });
    document.getElementById('balanceDisplay').textContent = fmt(total);
    return total;
  }
  function updateMascot(){
    const total = state.records.reduce((s,r)=> s + (r.type==='income'?r.amount:-r.amount), 0);
    const face = document.getElementById('mascotFace');
    if(total < 0) face.textContent = "😥";
    else if(total === 0) face.textContent = "🐷";
    else if(total < 10000) face.textContent = "🙂";
    else face.textContent = "😄";
  }

  // ---------- tabs ----------
  function switchPanel(name){
    document.querySelectorAll('.tab-panel').forEach(p=>{
      p.classList.toggle('active', p.id === 'panel-' + name);
    });
    document.querySelectorAll('nav button').forEach(b=>{
      b.classList.toggle('active', b.dataset.panel === name);
    });
    if(name === 'stats') renderStats();
    if(name === 'history') renderHistory();
  }

  // ---------- stats ----------
  function monthKey(y,m){ return y + "-" + String(m+1).padStart(2,'0'); }

  function renderStats(){
    if(!state.viewMonth){
      const now = new Date();
      state.viewMonth = {year: now.getFullYear(), month: now.getMonth()};
    }
    const {year, month} = state.viewMonth;
    document.getElementById('monthLabel').textContent = `${year}년 ${month+1}월`;

    const key = monthKey(year, month);
    const monthRecords = state.records.filter(r => r.date && r.date.startsWith(key));

    let income = 0, expense = 0, need = 0, want = 0;
    monthRecords.forEach(r=>{
      if(r.type === 'income') income += r.amount;
      else {
        expense += r.amount;
        if(r.needWant === 'need') need += r.amount;
        else if(r.needWant === 'want') want += r.amount;
      }
    });

    document.getElementById('sumIncome').textContent = fmt(income);
    document.getElementById('sumExpense').textContent = fmt(expense);
    document.getElementById('sumBalance').textContent = fmt(income - expense);

    // bar chart
    const barCtx = document.getElementById('barChart').getContext('2d');
    if(barChart) barChart.destroy();
    barChart = new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: ['수입', '지출'],
        datasets: [{
          data: [income, expense],
          backgroundColor: ['#7FD1AE', '#FF8C78'],
          borderRadius: 10,
          barThickness: 60
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { callback: v => v.toLocaleString('ko-KR') } }
        }
      }
    });

    // donut chart
    const donutCtx = document.getElementById('donutChart').getContext('2d');
    const donutEmpty = document.getElementById('donutEmpty');
    if(donutChart) donutChart.destroy();
    if(expense === 0){
      document.getElementById('donutWrap').style.display = 'none';
      donutEmpty.style.display = 'block';
    } else {
      document.getElementById('donutWrap').style.display = 'block';
      donutEmpty.style.display = 'none';
      donutChart = new Chart(donutCtx, {
        type: 'doughnut',
        data: {
          labels: ['🌱 필요해요', '🎈 갖고싶어요'],
          datasets: [{
            data: [need, want],
            backgroundColor: ['#7FD1AE', '#FFA6A0'],
            borderWidth: 0
          }]
        },
        options: {
          plugins: { legend: { position: 'bottom', labels: { font: { size: 12 } } } },
          cutout: '62%'
        }
      });
    }
  }

  // ---------- history ----------
  const CAT_LOOKUP = {};
  Object.keys(CATEGORIES).forEach(t=>{
    CATEGORIES[t].forEach(c=> CAT_LOOKUP[c.id] = c);
  });

  let pendingDeleteId = null;

  function renderHistory(){
    const list = document.getElementById('historyList');
    const empty = document.getElementById('historyEmpty');
    list.innerHTML = "";
    const sorted = [...state.records].sort((a,b)=> (b.date+b.id).localeCompare(a.date+a.id));
    if(sorted.length === 0){
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    let lastDate = null;
    sorted.forEach(r=>{
      if(r.date !== lastDate){
        const label = document.createElement('div');
        label.className = 'day-group-label';
        label.textContent = r.date;
        list.appendChild(label);
        lastDate = r.date;
      }
      const cat = CAT_LOOKUP[r.category] || {name:'기타', emoji:'✨'};
      const item = document.createElement('div');
      item.className = 'history-item';
      const nwBadge = r.needWant
        ? `<span class="h-nw ${r.needWant}">${r.needWant === 'need' ? '🌱필요' : '🎈원함'}</span>`
        : '';
      item.innerHTML = `
        <div class="h-icon ${r.type}">${cat.emoji}</div>
        <div class="h-info">
          <div class="h-cat">${cat.name}${nwBadge}${r.memo ? ' · ' + escapeHtml(r.memo) : ''}</div>
        </div>
        <div class="h-amt ${r.type}">${r.type === 'income' ? '+' : '-'}${fmt(r.amount)}</div>
        <button class="h-del" data-id="${r.id}">✕</button>
      `;
      list.appendChild(item);
    });

    list.querySelectorAll('.h-del').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.id;
        if(pendingDeleteId === id){
          state.records = state.records.filter(r=> r.id !== id);
          saveRecords();
          pendingDeleteId = null;
          renderHistory();
          renderBalance();
          updateMascot();
          showToast("지웠어요 🗑️");
        } else {
          list.querySelectorAll('.h-del').forEach(b=> {b.classList.remove('confirm'); b.textContent = '✕';});
          btn.classList.add('confirm');
          btn.textContent = '진짜?';
          pendingDeleteId = id;
        }
      });
    });
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- init / events ----------
  function init(){
    state.records = loadRecords();
    document.getElementById('dateInput').value = todayStr();
    document.getElementById('amountInput').addEventListener('input', formatAmountField);

    document.querySelectorAll('.type-toggle button').forEach(b=>{
      b.addEventListener('click', ()=> setType(b.dataset.type));
    });

    document.querySelectorAll('.quick-amounts button[data-amt]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const amtField = document.getElementById('amountInput');
        if(b.id === 'clearAmt'){ amtField.value = ""; return; }
        const cur = parseInt(digitsOnly(amtField.value), 10) || 0;
        amtField.value = (cur + parseInt(b.dataset.amt, 10)).toLocaleString('ko-KR');
      });
    });

    document.querySelectorAll('.nw-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        state.needWant = b.dataset.nw;
        renderNeedWant();
      });
    });

    document.getElementById('saveBtn').addEventListener('click', handleSave);

    document.querySelectorAll('nav button').forEach(b=>{
      b.addEventListener('click', ()=> switchPanel(b.dataset.panel));
    });

    document.getElementById('prevMonth').addEventListener('click', ()=>{
      state.viewMonth.month -= 1;
      if(state.viewMonth.month < 0){ state.viewMonth.month = 11; state.viewMonth.year -= 1; }
      renderStats();
    });
    document.getElementById('nextMonth').addEventListener('click', ()=>{
      state.viewMonth.month += 1;
      if(state.viewMonth.month > 11){ state.viewMonth.month = 0; state.viewMonth.year += 1; }
      renderStats();
    });

    renderCategoryGrid();
    renderNeedWant();
    renderBalance();
    updateMascot();
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
